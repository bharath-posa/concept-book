title: Slides, turns and flips
summary: "Sliding, turning or flipping a shape without changing its size or shape."
minutes: 3
cards:
  - type: hook
    text: In a video game, a character slides across the screen, spins around and faces the other way — but never gets bigger or squashed. What kind of moves are these?
    reveal: '**Rigid motions** — moves that keep every length and angle exactly the same.'
  - type: idea
    text: |
      A **rigid motion** moves a shape without changing its size or shape. There are three basic kinds:

      - **Translation** — slide it.
      - **Rotation** — turn it around a point.
      - **Reflection** — flip it over a line, like a mirror.

      After any rigid motion, every distance and every angle stays the same.
    svg: |
      <svg viewBox="0 0 240 80"><polygon points="10,60 30,20 45,60"/><polygon class="a" points="50,60 70,20 85,60"/><text x="18" y="76">slide</text><polygon points="115,65 130,30 145,65"/><polygon class="a" points="165,45 130,30 165,15"/><circle class="dot" cx="130" cy="30" r="2.5"/><text x="118" y="78">turn</text><line class="faint" x1="205" y1="10" x2="205" y2="70"/><polygon points="172,60 190,20 198,60"/><polygon class="a" points="238,60 220,20 212,60"/><text x="192" y="78">flip</text></svg>
  - type: predict
    q: You rotate a 4 cm line segment by 90°. How long is it afterwards?
    options: [Shorter, 4 cm, Longer]
    reveal: Still **4 cm**. Rotations, like all rigid motions, never change lengths.
  - type: choice
    q: Which of these is **not** a rigid motion?
    options:
      - text: Stretching a photo to make it wider
        correct: true
        why: Stretching changes lengths, so it isn't rigid.
      - text: Sliding a book across a table
        feedback: A slide (translation) keeps size and shape — it's rigid.
      - text: Seeing your face in a mirror
        feedback: A mirror image is a reflection — rigid. Stretching is the one that isn't.
  - type: build
  - type: choice
    q: A shape is flipped over a line. Its angles…
    options:
      - text: Stay exactly the same
        correct: true
        why: Reflections keep every angle and length.
      - text: All get bigger
        feedback: A flip doesn't resize anything — angles stay the same.
      - text: Change to their supplements
        feedback: Nothing changes size in a reflection; each angle keeps its measure.
review:
  - type: choice
    q: Turning a shape around a fixed point is called a…
    options:
      - text: Rotation
        correct: true
      - text: Translation
        feedback: A translation slides without turning.
      - text: Reflection
        feedback: A reflection flips over a line. Turning is rotation.
