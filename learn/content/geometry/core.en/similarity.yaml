title: Similar shapes
summary: "Same shape, different size: equal angles and sides in the same ratio."
minutes: 4
cards:
  - type: hook
    text: When you zoom into a photo, everything gets bigger — but faces don't look stretched. What stays the same?
    reveal: The **angles** and the **proportions**. The zoomed photo is **similar** to the original.
  - type: idea
    text: |
      Two shapes are **similar** (∼) if one is a scaled copy of the other (possibly also slid, turned or flipped).

      - Matching **angles are equal**.
      - Matching **sides are in the same ratio**, the **scale factor** k.

      Scale factor 2 doubles every length; ½ halves it.
    svg: |
      <svg viewBox="0 0 240 90"><polygon points="20,80 20,50 60,80"/><text x="2" y="68">3</text><text x="34" y="92">4</text><polygon class="a" points="100,80 100,20 180,80"/><text x="86" y="54">6</text><text x="134" y="92">8</text><text x="190" y="50">k = 2</text></svg>
  - type: steps
    title: Worked example
    problem: Triangle sides 3, 4, 5 are scaled by a factor of 2. Find the new sides.
    steps:
      - Multiply every side by 2.
      - "**6, 8 and 10**. The angles don't change at all."
  - type: number
    q: A shape is scaled by a factor of 3. A side that was 4 cm becomes…
    answer: 12
    formula: "4 * 3"
    unit: cm
    explain: 4 × 3 = 12 cm.
  - type: build
  - type: number
    q: Two similar triangles have matching sides 4 and 6. Another side of the small triangle is 6. How long is the matching side of the big one?
    answer: 9
    formula: "6 * 6 / 4"
    hint: Find the scale factor first (big ÷ small).
    explain: Scale factor = 6 ÷ 4 = 1.5, so 6 × 1.5 = 9.
review:
  - type: choice
    q: In similar shapes, matching angles are…
    options:
      - text: Equal
        correct: true
      - text: Multiplied by the scale factor
        feedback: Scaling changes lengths, never angles.
      - text: Supplementary
        feedback: Matching angles of similar shapes are equal.
  - type: number
    q: A model car is built at scale ½. Its real wheel is 60 cm across. How wide is the model's wheel?
    answer: 30
    formula: "60 / 2"
    unit: cm
    explain: Scale ½ halves every length — 60 ÷ 2 = 30 cm.
