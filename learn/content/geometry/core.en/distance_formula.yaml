title: The distance formula
summary: "Pythagoras on a grid: the straight-line distance between two points."
minutes: 4
cards:
  - type: hook
    text: A drone flies from (1, 2) to (4, 6) on a grid. How far did it fly in a straight line?
    reveal: '**5 units** — and Pythagoras tells us how.'
  - type: idea
    text: |
      The straight line between two points is the hypotenuse of a right triangle whose legs are the **change in x** and the **change in y**.

      **d = √((x₂ − x₁)² + (y₂ − y₁)²)**
    svg: |
      <svg viewBox="0 0 240 110"><circle class="dot" cx="50" cy="95" r="4"/><circle class="dot" cx="140" cy="15" r="4"/><line class="a thick" x1="50" y1="95" x2="140" y2="15"/><line class="faint" x1="50" y1="95" x2="140" y2="95"/><line class="faint" x1="140" y1="95" x2="140" y2="15"/><text x="80" y="108">x₂ − x₁</text><text x="146" y="60">y₂ − y₁</text><text x="60" y="48">d</text></svg>
  - type: steps
    title: Worked example
    problem: Find the distance from (1, 2) to (4, 6).
    steps:
      - "Change in x = 4 − 1 = 3. Change in y = 6 − 2 = 4."
      - "d = √(3² + 4²) = √25 = **5**."
  - type: number
    q: How far is (0, 0) from (5, 12)?
    answer: 13
    formula: "sqrt((5 - 0)**2 + (12 - 0)**2)"
    explain: √(25 + 144) = √169 = 13.
  - type: build
  - type: number
    q: How far is (−2, −1) from (4, 7)?
    answer: 10
    formula: "sqrt((4 - (-2))**2 + (7 - (-1))**2)"
    hint: Careful with negatives — 4 − (−2) = 6.
    explain: Changes are 6 and 8, so √(36 + 64) = √100 = 10.
review:
  - type: number
    q: How far is (2, 3) from (5, 7)?
    answer: 5
    formula: "sqrt((5 - 2)**2 + (7 - 3)**2)"
    explain: Changes 3 and 4 → √25 = 5.
