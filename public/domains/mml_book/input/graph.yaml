# Concept map of "Mathematics for Machine Learning" (Deisenroth, Faisal, Ong; Cambridge University Press 2020),
# https://mml-book.com — one concept per book section. Definitions are written fresh, not quoted from the book.
domain: mml_book
book:
  title: Mathematics for Machine Learning
  authors: Marc Peter Deisenroth, A. Aldo Faisal and Cheng Soon Ong
  publisher: Cambridge University Press
  year: 2020
  url: https://mml-book.com
primitives:
  vector:
    defines: a list of numbers, e.g. one data point's features; vectors can be added and scaled
    tier: 0
    chapter: 1
  matrix:
    defines: a rectangular grid of numbers; a table of data, or a machine that transforms vectors
    tier: 0
    chapter: 1
  derivative:
    defines: the rate of change of a function; the slope of its graph at a point
    tier: 0
    chapter: 1
  probability:
    defines: a number from 0 to 1 for how likely something is; all possibilities add to 1
    tier: 0
    chapter: 1
first_radical_primitives:
- vector
- matrix
- derivative
- probability
concepts:
  systems_of_linear_equations:
    composed_of:
    - vector
    - matrix
    defines: several linear equations solved together, written compactly as Ax = b
    chapter: 2
    section: '2.1'
    verifier: sympy
    play: find prices from two shopping receipts
    tier: 1
  matrix_operations:
    composed_of:
    - matrix
    defines: matrix addition, multiplication (rows times columns), identity, transpose and inverse
    chapter: 2
    section: '2.2'
    verifier: sympy
    play: multiply a 2×2 by a 2×1 by hand
    tier: 1
  gaussian_elimination:
    composed_of:
    - systems_of_linear_equations
    - matrix_operations
    defines: solve Ax = b with row operations down to row-echelon form; also finds inverses
    chapter: 2
    section: '2.3'
    verifier: sympy
    play: reduce a 3×3 system row by row
    tier: 2
  vector_spaces:
    composed_of:
    - vector
    defines: a set of vectors closed under adding and scaling; subspaces are vector spaces inside it
    chapter: 2
    section: '2.4'
    verifier: sympy
    play: check whether a line through the origin is closed
    tier: 1
  linear_independence:
    composed_of:
    - vector_spaces
    defines: no vector in the set is a combination of the others; only the trivial combination gives 0
    chapter: 2
    section: '2.5'
    verifier: sympy
    play: try to build one arrow from two others
    tier: 2
  basis_and_rank:
    composed_of:
    - linear_independence
    - gaussian_elimination
    defines: a basis is a minimal spanning set; rank is the number of independent columns
    chapter: 2
    section: '2.6'
    verifier: sympy
    play: count pivots after elimination
    tier: 3
  linear_mappings:
    composed_of:
    - matrix_operations
    - basis_and_rank
    defines: a function that keeps sums and scalings; in a basis it is a matrix; kernel and image
    chapter: 2
    section: '2.7'
    verifier: sympy
    play: see what a matrix does to a grid
    tier: 4
  affine_spaces:
    composed_of:
    - vector_spaces
    - systems_of_linear_equations
    defines: a subspace shifted away from the origin, like the solution set of Ax = b
    chapter: 2
    section: '2.8'
    verifier: sympy
    play: slide a line off the origin
    tier: 2
  norms:
    composed_of:
    - vector_spaces
    defines: 'a vector''s length: Manhattan (ℓ1) or Euclidean (ℓ2)'
    chapter: 3
    section: '3.1'
    verifier: sympy
    play: compare taxi and crow distances on a grid
    tier: 2
  inner_products:
    composed_of:
    - vector_spaces
    - matrix_operations
    defines: a symmetric, positive definite way to multiply two vectors; the dot product is one; ⟨x,y⟩ = xᵀAy
    chapter: 3
    section: '3.2'
    verifier: sympy
    play: compute a dot product from coordinates
    tier: 2
  lengths_and_distances:
    composed_of:
    - norms
    - inner_products
    defines: an inner product gives length ‖x‖ = √⟨x,x⟩ and distance d(x,y) = ‖x − y‖
    chapter: 3
    section: '3.3'
    verifier: sympy
    play: measure how similar two data points are
    tier: 3
  angles_and_orthogonality:
    composed_of:
    - inner_products
    - lengths_and_distances
    defines: cos ω = ⟨x,y⟩ / (‖x‖‖y‖); orthogonal means ⟨x,y⟩ = 0
    chapter: 3
    section: '3.4'
    verifier: sympy
    play: rotate one arrow until the dot product is zero
    tier: 4
  orthonormal_basis:
    composed_of:
    - angles_and_orthogonality
    - basis_and_rank
    defines: basis vectors of length 1 that are mutually orthogonal; Gram–Schmidt builds one
    chapter: 3
    section: '3.5'
    verifier: sympy
    play: straighten two skewed arrows into a square corner
    tier: 5
  orthogonal_projections:
    composed_of:
    - orthonormal_basis
    - linear_mappings
    defines: 'the closest point in a subspace: π(x) = B(BᵀB)⁻¹Bᵀx'
    chapter: 3
    section: '3.8'
    verifier: sympy
    play: drop a shadow of a vector onto a line
    tier: 6
  rotations:
    composed_of:
    - orthonormal_basis
    - linear_mappings
    defines: linear maps that turn space without stretching; orthogonal matrices with determinant 1
    chapter: 3
    section: '3.9'
    verifier: sympy
    play: rotate a shape by an angle θ
    tier: 6
  determinant_and_trace:
    composed_of:
    - matrix_operations
    - gaussian_elimination
    defines: det A = how much A scales area or volume (0 means not invertible); trace = sum of the diagonal
    chapter: 4
    section: '4.1'
    verifier: sympy
    play: stretch a unit square and read its area
    tier: 3
  eigenvalues_and_eigenvectors:
    composed_of:
    - determinant_and_trace
    - linear_mappings
    defines: 'Ax = λx: directions A only stretches; λ solves det(A − λI) = 0'
    chapter: 4
    section: '4.2'
    verifier: sympy
    play: find the arrows a matrix doesn't turn
    tier: 5
  cholesky_decomposition:
    composed_of:
    - inner_products
    - matrix_operations
    defines: a symmetric positive definite A factors as LLᵀ with L lower-triangular — a matrix square root
    chapter: 4
    section: '4.3'
    verifier: sympy
    play: factor a 2×2 covariance matrix
    tier: 3
  eigendecomposition:
    composed_of:
    - eigenvalues_and_eigenvectors
    - orthonormal_basis
    defines: A = PDP⁻¹ with D diagonal; symmetric matrices get an orthonormal P (spectral theorem)
    chapter: 4
    section: '4.4'
    verifier: sympy
    play: compute A¹⁰ the easy way
    tier: 6
  singular_value_decomposition:
    composed_of:
    - eigendecomposition
    defines: 'any matrix A = UΣVᵀ: rotate, stretch along axes, rotate'
    chapter: 4
    section: '4.5'
    verifier: sympy
    play: watch a circle become an ellipse
    tier: 7
  matrix_approximation:
    composed_of:
    - singular_value_decomposition
    - norms
    defines: keep the top k singular values for the best rank-k approximation (Eckart–Young)
    chapter: 4
    section: '4.6'
    verifier: sympy
    play: compress an image with fewer and fewer ranks
    tier: 8
  partial_derivatives_and_gradients:
    composed_of:
    - derivative
    - vector
    defines: ∂f/∂xᵢ holds the other inputs fixed; the gradient collects them and points uphill; chain rule
    chapter: 5
    section: '5.2'
    verifier: sympy
    play: walk uphill on a contour map
    tier: 1
  jacobian:
    composed_of:
    - partial_derivatives_and_gradients
    - matrix
    defines: the matrix of all partial derivatives of a vector-valued function; |det J| scales areas
    chapter: 5
    section: '5.3'
    verifier: sympy
    play: zoom in until a curved map looks linear
    tier: 2
  backpropagation:
    composed_of:
    - jacobian
    defines: the chain rule applied backwards through a computation graph — automatic differentiation
    chapter: 5
    section: '5.6'
    verifier: sympy
    play: push a gradient back through a tiny network
    tier: 3
  hessian_and_taylor_series:
    composed_of:
    - partial_derivatives_and_gradients
    - matrix
    defines: second derivatives form the Hessian; Taylor series approximate f near a point with polynomials
    chapter: 5
    section: '5.8'
    verifier: sympy
    play: fit a parabola to a curve at a point
    tier: 2
  probability_space:
    composed_of:
    - probability
    defines: sample space, events and a probability measure; a random variable maps outcomes to numbers
    chapter: 6
    section: '6.1'
    verifier: sympy
    play: list the outcomes of two dice
    tier: 1
  probability_density:
    composed_of:
    - probability_space
    defines: discrete variables have a mass function; continuous ones a density p(x) whose area is probability
    chapter: 6
    section: '6.2'
    verifier: sympy
    play: shade the area under a curve
    tier: 2
  sum_product_bayes:
    composed_of:
    - probability_density
    defines: sum rule p(x) = Σ p(x,y), product rule p(x,y) = p(y|x)p(x), and Bayes' theorem p(θ|x) ∝ p(x|θ)p(θ)
    chapter: 6
    section: '6.3'
    verifier: sympy
    play: update a belief after a test result
    tier: 3
  mean_and_covariance:
    composed_of:
    - probability_density
    - matrix
    defines: mean = expected value; covariance matrix = how variables vary together; independence
    chapter: 6
    section: '6.4'
    verifier: sympy
    play: spot positive and negative correlation in a scatter plot
    tier: 3
  gaussian_distribution:
    composed_of:
    - mean_and_covariance
    defines: the bell curve N(μ, Σ); its marginals, conditionals and sums are Gaussian too
    chapter: 6
    section: '6.5'
    verifier: sympy
    play: move μ and stretch Σ of a 2-D bell
    tier: 4
  conjugate_priors:
    composed_of:
    - sum_product_bayes
    - gaussian_distribution
    defines: a prior whose posterior has the same form, e.g. Beta–Binomial; the exponential family
    chapter: 6
    section: '6.6'
    verifier: sympy
    play: update a coin's Beta prior after flips
    tier: 5
  change_of_variables:
    composed_of:
    - probability_density
    - jacobian
    defines: 'the density of y = g(x): p(y) = p(x)·|dx/dy|'
    chapter: 6
    section: '6.7'
    verifier: sympy
    play: square a uniform variable and see its density
    tier: 3
  gradient_descent:
    composed_of:
    - partial_derivatives_and_gradients
    defines: repeat x ← x − γ∇f(x); step size and momentum
    chapter: 7
    section: '7.1'
    verifier: sympy
    play: roll a ball downhill with different step sizes
    tier: 2
  stochastic_gradient_descent:
    composed_of:
    - gradient_descent
    - mean_and_covariance
    defines: use the gradient of a small random batch — noisy but unbiased and cheap
    chapter: 7
    section: 7.1.3
    verifier: sympy
    play: train on mini-batches and watch the wobble
    tier: 4
  lagrange_multipliers:
    composed_of:
    - partial_derivatives_and_gradients
    defines: 'at a constrained optimum the gradients of f and the constraint line up: ∇f = λ∇g'
    chapter: 7
    section: '7.2'
    verifier: sympy
    play: find the best point on a circle
    tier: 2
  convex_optimization:
    composed_of:
    - lagrange_multipliers
    - hessian_and_taylor_series
    defines: 'convex functions have no false valleys: any local minimum is global; LPs, QPs, duality'
    chapter: 7
    section: '7.3'
    verifier: sympy
    play: test chords lying above a curve
    tier: 3
  empirical_risk_minimization:
    composed_of:
    - lengths_and_distances
    - gradient_descent
    defines: choose parameters that minimize the average loss on the training data
    chapter: 8
    section: '8.2'
    verifier: sympy
    play: fit a line by minimizing squared errors
    tier: 4
  regularization:
    composed_of:
    - empirical_risk_minimization
    - norms
    defines: add a penalty like λ‖θ‖² to discourage overly complex fits; test on held-out data
    chapter: 8
    section: 8.2.3
    verifier: sympy
    play: add wiggle to a fit and watch test error rise
    tier: 5
  maximum_likelihood:
    composed_of:
    - sum_product_bayes
    - gradient_descent
    defines: choose parameters that make the observed data most probable; minimize negative log-likelihood
    chapter: 8
    section: '8.3'
    verifier: sympy
    play: slide a bell curve to best fit some points
    tier: 4
  map_estimation:
    composed_of:
    - maximum_likelihood
    - conjugate_priors
    defines: maximize posterior = likelihood × prior; a Gaussian prior acts like L2 regularization
    chapter: 8
    section: 8.3.2
    verifier: sympy
    play: pull an estimate toward a prior guess
    tier: 6
  graphical_models:
    composed_of:
    - sum_product_bayes
    defines: a directed graph that shows how a joint distribution factorizes; conditional independence
    chapter: 8
    section: '8.5'
    verifier: sympy
    play: draw arrows for rain, sprinkler and wet grass
    tier: 4
  model_selection:
    composed_of:
    - regularization
    - maximum_likelihood
    defines: pick model complexity with cross-validation or Bayesian evidence; Occam's razor
    chapter: 8
    section: '8.6'
    verifier: sympy
    play: compare polynomial degrees on held-out folds
    tier: 6
  least_squares_regression:
    composed_of:
    - maximum_likelihood
    - orthogonal_projections
    - gaussian_distribution
    defines: with Gaussian noise, MLE gives θ = (XᵀX)⁻¹Xᵀy — an orthogonal projection of y onto X's columns
    chapter: 9
    section: '9.2'
    verifier: sympy
    play: fit house prices to size
    tier: 7
  regularized_regression:
    composed_of:
    - least_squares_regression
    - map_estimation
    - regularization
    defines: 'MAP with a Gaussian prior gives ridge regression: θ = (XᵀX + λI)⁻¹Xᵀy'
    chapter: 9
    section: 9.2.3
    verifier: sympy
    play: turn λ up and watch wild coefficients shrink
    tier: 8
  bayesian_linear_regression:
    composed_of:
    - regularized_regression
    - conjugate_priors
    defines: keep the full posterior over θ and average predictions over it, giving error bars
    chapter: 9
    section: '9.3'
    verifier: sympy
    play: see uncertainty grow away from the data
    tier: 9
  principal_component_analysis:
    composed_of:
    - mean_and_covariance
    - eigendecomposition
    - lagrange_multipliers
    defines: 'project data onto the directions of greatest variance: the top eigenvectors of the covariance matrix'
    chapter: 10
    section: '10.2'
    verifier: sympy
    play: find the long axis of a cloud of points
    tier: 7
  pca_in_practice:
    composed_of:
    - principal_component_analysis
    - singular_value_decomposition
    - orthogonal_projections
    defines: center (and standardize), take the SVD, keep k components, project; reconstruction error
    chapter: 10
    section: '10.6'
    verifier: sympy
    play: squash 2-D points onto one line and rebuild them
    tier: 8
  gaussian_mixture_model:
    composed_of:
    - gaussian_distribution
    - sum_product_bayes
    defines: 'p(x) = Σ πₖ N(x | μₖ, Σₖ): a weighted blend of bells for clumpy data'
    chapter: 11
    section: '11.1'
    verifier: sympy
    play: mix two bells and adjust their weights
    tier: 5
  expectation_maximization:
    composed_of:
    - gaussian_mixture_model
    - maximum_likelihood
    defines: 'alternate: E-step computes responsibilities, M-step refits means, covariances and weights'
    chapter: 11
    section: '11.3'
    verifier: sympy
    play: let two clusters claim points round by round
    tier: 6
  separating_hyperplanes:
    composed_of:
    - inner_products
    - affine_spaces
    defines: the set ⟨w, x⟩ + b = 0 splits space in two; the sign tells the class
    chapter: 12
    section: '12.1'
    verifier: sympy
    play: draw a line between red and blue points
    tier: 3
  primal_svm:
    composed_of:
    - separating_hyperplanes
    - lengths_and_distances
    - regularization
    defines: maximize the margin 1/‖w‖; soft margin allows mistakes with hinge loss and a C penalty
    chapter: 12
    section: '12.2'
    verifier: sympy
    play: widen the street between two classes
    tier: 6
  dual_svm:
    composed_of:
    - primal_svm
    - lagrange_multipliers
    - convex_optimization
    defines: solve for Lagrange multipliers instead; only support vectors get αᵢ > 0
    chapter: 12
    section: '12.3'
    verifier: sympy
    play: find which points hold the street up
    tier: 7
  kernels:
    composed_of:
    - dual_svm
    - inner_products
    defines: replace ⟨xᵢ, xⱼ⟩ with k(xᵢ, xⱼ) to separate data in a richer feature space without computing it
    chapter: 12
    section: '12.4'
    verifier: sympy
    play: lift a ring of points into 3-D and split it flat
    tier: 8
applications:
  recommender_systems:
    needs:
    - matrix_approximation
    domain: recommender systems
    defines: filling in a sparse users × films table with a low-rank approximation
  image_compression:
    needs:
    - matrix_approximation
    - pca_in_practice
    domain: image compression
    defines: storing a picture with a few singular vectors or principal components
  training_neural_networks:
    needs:
    - backpropagation
    - stochastic_gradient_descent
    domain: deep learning
    defines: gradients by backpropagation, steps by stochastic gradient descent
  price_prediction:
    needs:
    - bayesian_linear_regression
    domain: forecasting
    defines: predicting a price with honest error bars
  customer_segmentation:
    needs:
    - expectation_maximization
    domain: marketing
    defines: finding natural groups of customers with a mixture model
  spam_filtering:
    needs:
    - kernels
    domain: email
    defines: a kernel SVM separating spam from real mail
  robot_arms:
    needs:
    - rotations
    - jacobian
    domain: robotics
    defines: turning joint angles into hand positions and velocities
  medical_diagnosis:
    needs:
    - graphical_models
    - map_estimation
    domain: diagnosis
    defines: reasoning from symptoms to causes with a probabilistic model
